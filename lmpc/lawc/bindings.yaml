# Bindings — the one-time human work.
#
# Six generic operators are written once in lmpc/engine/operators.py. This file points
# each legal requirement at one of them and records what a reviewer confirmed against the
# gazette page image. Bindings attach to a rule-tree NODE, not to values, so when an
# amendment substitutes that node's contents the parameters reload and this file is
# untouched.
#
# confirmed_values exist so the build FAILS if the gazette ever says something different
# from what a human approved. Silent drift is the failure mode we cannot accept.

rulepack: lmpc
schema: 1

# --------------------------------------------------------------- applicability gates ---
# Run before any check. A gate that fires ends evaluation with NOT_APPLICABLE.
gates:
  - id: GATE-R3-BULK
    clause: "Rule 3(a)(b)(c)"
    node: lmpc/r3
    operator: applicability
    citation: {gsr: "G.S.R. 202(E)", page: 3, dated: "2011-03-07"}
    params:
      any_of:
        - {field: net_quantity_g, gt: 25000}
        - {field: net_quantity_ml, gt: 25000}
        - {field: category, in: [CEMENT, FERTILIZER, FARM_PRODUCE], and_field: net_quantity_g, gt: 50000}
        - {field: buyer_type, in: [INDUSTRIAL, INSTITUTIONAL]}
    effect: CHAPTER_II_NOT_APPLICABLE

  - id: GATE-R26-EXEMPT
    clause: "Rule 26"
    node: lmpc/r26
    operator: applicability
    citation: {gsr: "G.S.R. 202(E)", page: 17, dated: "2011-03-07"}
    params:
      any_of:
        - {field: net_quantity_g, lte: 10, unless_field: category, unless_in: [TOBACCO]}
        - {field: net_quantity_ml, lte: 10, unless_field: category, unless_in: [TOBACCO]}
        - {field: category, in: [RESTAURANT_FAST_FOOD]}
        - {field: category, in: [DPCO_FORMULATION]}
        - {field: category, in: [HANDLOOM_THREAD_COIL]}
    effect: ALL_RULES_NOT_APPLICABLE

  - id: GATE-R7-5-OTHER-LAW
    clause: "Rule 7(5)"
    node: lmpc/r7/sr5
    operator: applicability
    citation: {gsr: "G.S.R. 629(E)", page: 12, dated: "2017-06-23"}
    params:
      when: {field: other_law_requires_same_info, eq: true}
    effect: SKIP_TYPOGRAPHY_EXCEPT
    exceptions: [net_quantity, mrp, expiry_date, consumer_care]

# ------------------------------------------------------------------------- the checks ---
checks:
  # --- presence, Rule 6(1) ---
  - {check: LMPC-R6-1-A-MANUFACTURER, node: lmpc/r6/sr1/cla, clause: "Rule 6(1)(a)", operator: presence, field: manufacturer_block, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}}
  - check: LMPC-R6-1-B-GENERIC-NAME
    node: lmpc/r6/sr1/clb
    clause: "Rule 6(1)(b)"
    operator: presence
    field: generic_name
    effective_from: 2011-04-01
    citation: {gsr: "G.S.R. 202(E)", page: 8}
    # A generic name carries no heading to anchor on — "Biscuits" and a brand name look
    # identical to a scorer. Until an officer confirms it, this check may report and
    # explain, never accuse.
    verdict_ceiling: INDETERMINATE
    ceiling_reason: >
      No lexical anchor exists for the common or generic name; distinguishing it from a
      brand name requires human judgement.
  - {check: LMPC-R6-1-C-NET-QUANTITY, node: lmpc/r6/sr1/clc, clause: "Rule 6(1)(c)", operator: presence, field: net_quantity, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}}
  - {check: LMPC-R6-1-D-MFG-DATE, node: lmpc/r6/sr1/cld, clause: "Rule 6(1)(d)", operator: presence, field: mfg_date, effective_from: 2011-04-01, not_required_when: {scan_mode: ECOMMERCE_LISTING}, citation: {gsr: "G.S.R. 202(E)", page: 8}}
  - {check: LMPC-R6-1-E-MRP, node: lmpc/r6/sr1/cle, clause: "Rule 6(1)(e)", operator: presence, field: mrp, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}}
  - {check: LMPC-R6-1-F-CONSUMER-CARE, node: lmpc/r6/sr1/clf, clause: "Rule 6(1)(f)", operator: presence, field: consumer_care, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}}
  - {check: LMPC-R6-COUNTRY-OF-ORIGIN, node: lmpc/r6/sr1/clh, clause: "Rule 6(1)", operator: presence, field: country_of_origin, only_when: {is_imported: true}, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}}

  # --- format ---
  - check: LMPC-R6-1-E-MRP-FORM
    node: lmpc/r6/sr1/cle
    clause: "Rule 6(1)(e)"
    operator: format_regex
    field: mrp
    effective_from: 2018-01-01
    citation: {gsr: "G.S.R. 629(E)", page: 10, dated: "2017-06-23"}
    params:
      # The four illustrations given in the 2017 amendment, p.10.
      # Structure only: the anchor and the numeral. Digits are the finding, so these
      # are matched exactly.
      # The anchor is NOT re-checked here: extraction already established that this
      # block is the MRP, using fuzzy matching. Re-asserting it with an exact regex only
      # re-fails on OCR damage ("MRPRs.", "MeP"). This checks the value and the wording.
      regex: '(?i)(rs\.?|₹|inr)\s*\d+(\.\d{1,2})?'
      # The prescribed wording is matched FUZZILY: OCR damages words ("of"->"vf"), and a
      # damaged reading of compliant wording is not a violation.
      phrase_any: ["inclusive of all taxes", "incl. of all taxes", "incl of all taxes"]
      phrase_present_at: 85      # >= this: the wording is there
      phrase_absent_below: 60    # < this: the wording is genuinely missing
                                 # in between: INDETERMINATE, a human reads the crop
      illustrations:
        - "Maximum retail price Rs. xx.xx (inclusive of all taxes)"
        - "Max. retail price Rs. xx.xx inclusive of all taxes"
        - "MRP Rs. xx.xx incl. of all taxes"
        - "MRP Rs. xx.xx (incl. of all taxes)"

  - check: LMPC-R6-1-E-MRP-ROUNDING
    node: lmpc/r6/sr1/cle
    clause: "Rule 6(1)(e)"
    operator: numeric_predicate
    field: mrp
    effective_from: 2018-01-01
    citation: {gsr: "G.S.R. 629(E)", page: 10, dated: "2017-06-23"}
    params: {predicate: rounded_to_rupee_or_50_paise}

  - {check: LMPC-R6-1-C-QTY-FORM, node: lmpc/r6/sr1/clc, clause: "Rule 6(1)(c)", operator: format_regex, field: net_quantity, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}, params: {regex: '(?i)\b\d+(\.\d+)?\s*(g|gm|gms|kg|ml|l|litre|liter|n|u)\b'}}
  - {check: LMPC-R6-1-D-DATE-FORM, node: lmpc/r6/sr1/cld, clause: "Rule 6(1)(d)", operator: format_regex, field: mfg_date, effective_from: 2011-04-01, citation: {gsr: "G.S.R. 202(E)", page: 8}, params: {regex: '(?i)(\b(0?[1-9]|1[0-2])[/-]\d{2,4}\b|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*,?\s*\d{4}\b)'}}
  - {check: LMPC-R10-PIN-CODE, node: lmpc/r10/sr1, clause: "Rule 10(1) Expl. 1", operator: format_regex, field: manufacturer_block, effective_from: 2018-01-01, citation: {gsr: "G.S.R. 629(E)", page: 12, dated: "2017-06-23"}, params: {regex: '\b\d{6}\b'}}

  - check: LMPC-R6-1-LL-UNIT-SALE-PRICE
    node: lmpc/r6/sr1/clll
    clause: "Rule 6(1)(ll)"
    operator: tiered_format
    field: unit_sale_price
    effective_from: 2022-04-01
    citation: {gsr: "G.S.R. 226(E)", page: 2, dated: "2022-03-28"}
    params:
      tiers:
        - {when: {measure: weight, lt_value: 1000, unit: g},  form: "Rs. _ per g"}
        - {when: {measure: weight, gte_value: 1000, unit: g}, form: "Rs. _ per kg"}
        - {when: {measure: volume, lt_value: 1000, unit: ml}, form: "Rs. _ per ml"}
        - {when: {measure: volume, gte_value: 1000, unit: ml},form: "Rs. _ per litre"}
        - {when: {measure: length, lt_value: 100, unit: cm},  form: "Rs. _ per cm"}
        - {when: {measure: length, gte_value: 100, unit: cm}, form: "Rs. _ per meter"}
        - {when: {measure: count},                            form: "Rs. _ per number"}

  # --- typography and placement: no scale reference needed ---
  - check: LMPC-R7-3-WIDTH-RATIO
    node: lmpc/r7/sr3
    clause: "Rule 7(3)"
    operator: ratio_min
    effective_from: 2018-01-01
    citation: {gsr: "G.S.R. 629(E)", page: 11, dated: "2017-06-23"}
    params:
      numerator: glyph_width_px
      denominator: glyph_height_px
      min: 0.3333
      exclude_glyphs: ["1", "i", "I", "l"]

  - check: LMPC-R8-CLEAR-SPACE
    node: lmpc/r8
    clause: "Rule 8"
    operator: clear_space
    effective_from: 2011-04-01
    citation: {gsr: "G.S.R. 202(E)", page: 12}
    params: {field: net_quantity, above_below_multiple: 1.0, left_right_multiple: 2.0}

  # --- typography: needs a scale reference ---
  - check: LMPC-R7-2-MIN-HEIGHT
    node: lmpc/r7/table-I
    clause: "Rule 7(2) Table-I"
    operator: table_lookup
    # Rule 7(2) has required a minimum letter height since 2011. What the 2017 amendment
    # changed is the TABLE, not the existence of the requirement - so the check runs from
    # 2011 and the table versions below carry their own windows. Dating the check itself
    # to 2018 would wrongly report "no such rule" for a 2015 inspection.
    effective_from: 2011-04-01
    table_effective_from: 2018-01-01   # when the substituted Table-I came into force
    citation: {gsr: "G.S.R. 629(E)", page: 11, dated: "2017-06-23"}
    params:
      input: pdp_area_cm2
      compare: glyph_height_mm
      molded_column_when: {field: is_molded, eq: true}
    # Confirmed by two reviewers against the rendered page image on 2026-09-07.
    # The gazette TEXT LAYER drops the '≤' glyph; these operators come from the IMAGE.
    boundary_review:
      status: UNRESOLVED
      note: >
        Reviewers could not agree whether row edges are '<' or '≤'; the printed table
        shows 'A < 50' and '50 < A < 100', leaving A=50 undefined. Until a legal
        reviewer rules, measurements within the guard band abstain.
      policy: guard_band
      guard_band_cm2: 0.5
    # The table before the 2017 amendment: keyed to NET QUANTITY, not panel area.
    # It is repealed, but a package inspected before 2018-01-01 is still governed by it.
    # Deleting superseded law makes old findings unreproducible.
    superseded:
      - effective_from: 2011-04-01
        effective_to: 2017-12-31
        keyed_by: net_quantity_g
        source_instrument: "G.S.R. 202(E)"
        rows:
          - {upper: 200,   min_mm: 1.0, molded_mm: 1.0}
          - {upper: 1000,  min_mm: 2.0, molded_mm: 2.0}
          - {upper: null,  min_mm: 4.0, molded_mm: 4.0}
    confirmed_values:
      - {upper_cm2: 50,   min_mm: 1.0, molded_mm: 1.5}
      - {upper_cm2: 100,  min_mm: 1.5, molded_mm: 3.0}
      - {upper_cm2: 500,  min_mm: 2.5, molded_mm: 4.0}
      - {upper_cm2: 2500, min_mm: 4.0, molded_mm: 6.0}
      - {upper_cm2: null, min_mm: 6.0, molded_mm: 6.0}

  # --- consistency ---
  - check: LMPC-XF-UNIT-PRICE-CONSISTENT
    node: lmpc/r6/sr1/clll
    clause: "Rule 6(1)(ll)"
    operator: cross_field
    effective_from: 2022-04-01
    citation: {gsr: "G.S.R. 226(E)", page: 2, dated: "2022-03-28"}
    params: {expr: unit_price_matches_mrp_over_quantity, tolerance_pct: 5.0,
             on_mismatch: REVIEW_REQUIRED}

# ------------------------------------------------------------ mode-specific rule sets ---
modes:
  PHYSICAL_PACKAGE:
    excludes: []
  ECOMMERCE_LISTING:
    # Rule 6(10), inserted by G.S.R. 629(E): all mandatory declarations EXCEPT
    # the month and year of manufacture or packing.
    excludes: [LMPC-R6-1-D-MFG-DATE, LMPC-R6-1-D-DATE-FORM,
               LMPC-R7-2-MIN-HEIGHT, LMPC-R7-3-WIDTH-RATIO, LMPC-R8-CLEAR-SPACE]
    citation: {gsr: "G.S.R. 629(E)", page: 10, dated: "2017-06-23"}
