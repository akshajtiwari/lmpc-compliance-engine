name: Windows portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "SemVer tag for the portable release"
        required: true
        default: "v0.1.0-local-preview"
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: true
        type: boolean

concurrency:
  group: windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt
      - name: Run deterministic test suite
        run: python -m pytest -q

  build-and-release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRE_RELEASE: ${{ inputs.prerelease }}
      LMPC_PANGO_DLL_DIR: C:\msys64\ucrt64\bin
      WEASYPRINT_DLL_DIRECTORIES: C:\msys64\ucrt64\bin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
            requirements-build.txt
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "release_tag must be a SemVer-style tag such as v0.1.0-local-preview"
          }
      - name: Install Pango runtime
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pango"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 Pango installation failed" }
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt -r requirements-build.txt
      - name: Build portable application
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging/LMPC-Compliance.spec
      - name: Add usage guide
        shell: pwsh
        run: Copy-Item packaging/WINDOWS-README.txt dist/LMPC-Compliance/README.txt
      - name: Exercise packaged OCR and report engines
        shell: pwsh
        run: |
          $env:LMPC_DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP "lmpc-self-test"
          & dist\LMPC-Compliance\LMPC-Compliance.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged application self-test failed" }
      - name: Smoke-test packaged localhost server
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "lmpc-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lmpc-server.stderr.log"
          $server = Start-Process -FilePath "dist\LMPC-Compliance\LMPC-Compliance.exe" `
            -ArgumentList "--no-browser", "--port", "8765" -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            foreach ($attempt in 1..90) {
              if ($server.HasExited) { throw "Packaged server exited before readiness" }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8765/readyz" -TimeoutSec 2
                if ($response.status -eq "ok") { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw "Packaged server did not become ready" }
            $version = Invoke-RestMethod -Uri "http://127.0.0.1:8765/version" -TimeoutSec 5
            if (-not $version.version -or -not $version.rulepack_sha256) {
              throw "Packaged version endpoint did not return rulepack identity"
            }
            # The pairing page is the only way to connect a phone, and its QR comes from
            # a pure-Python dependency that PyInstaller has to resolve. A frozen build
            # that cannot draw it is useless in the field, so fail the release here.
            $pair = Invoke-WebRequest -Uri "http://127.0.0.1:8765/pair" -TimeoutSec 5
            if ($pair.Content -notmatch '/pair/qr\.svg') {
              throw "Packaged pairing page did not render the enrollment QR"
            }
            $qr = Invoke-WebRequest -Uri "http://127.0.0.1:8765/pair/qr.svg" -TimeoutSec 5
            if ($qr.Content -notmatch '<svg') {
              throw "Packaged build could not render a QR code"
            }
            # A QR that draws is not a QR that works. The preview failed here: the code
            # was perfect and carried an address no phone could dial. Assert the build
            # advertises a real address, not loopback and not nothing.
            $state = Invoke-RestMethod -Uri "http://127.0.0.1:8765/pair/status" -TimeoutSec 5
            if (-not $state.lan_url) {
              throw "Packaged build issued a QR with no server address in it"
            }
            if ($state.lan_url -match '127\.0\.0\.1|localhost') {
              throw "Packaged build advertised a loopback address no phone can reach: $($state.lan_url)"
            }
            Write-Host "Pairing advertises $($state.lan_url)"
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $zipName = "LMPC-Compliance-$($env:RELEASE_TAG)-windows-x64.zip"
          Compress-Archive -Path "dist\LMPC-Compliance\*" -DestinationPath "dist\$zipName"
          $hash = (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LMPC-Compliance-${{ inputs.release_tag }}-windows-x64
          path: |
            dist/LMPC-Compliance-${{ inputs.release_tag }}-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipName = "LMPC-Compliance-$($env:RELEASE_TAG)-windows-x64.zip"
          @"
          Windows portable preview for running and testing LMPC Compliance entirely on localhost.

          - No S3 or Docker required.
          - Extract the ZIP and run LMPC-Compliance.exe.
          - The CI build passed the Python suite, packaged OCR/PDF/DOCX self-test, and localhost readiness smoke test.
          - This preview keeps scan metadata for the current server session. Use the PostgreSQL local stack for durable multi-user operation.
          "@ | Set-Content -Encoding utf8 "dist\release-notes.md"
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "dist\$zipName", "dist\SHA256SUMS.txt",
            "--target", $env:GITHUB_SHA,
            "--title", "LMPC Compliance $($env:RELEASE_TAG)",
            "--notes-file", "dist\release-notes.md"
          )
          if ($env:PRE_RELEASE -eq "true") { $arguments += "--prerelease" }
          # A shared tag may already carry the Field APK; replace assets instead of failing.
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG "dist\$zipName" "dist\SHA256SUMS.txt" --clobber
          } else {
            gh @arguments
          }
