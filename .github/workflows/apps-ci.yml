name: Field and Workbench CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "lmpc/server/**"
      - ".github/workflows/apps-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "lmpc/server/**"
      - ".github/workflows/apps-ci.yml"
  workflow_dispatch:

jobs:
  server-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt
      - name: Verify Field, Workbench and server contracts
        run: >-
          python -m pytest -q
          tests/test_api_scans.py
          tests/test_pipeline.py
          tests/test_mobile_server.py
          tests/test_rbac.py
          tests/test_db_models.py
          tests/test_import_graph.py

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  field:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run doctor
      - run: npx expo export --platform android --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: lmpc-field-js-bundle
          path: apps/mobile/dist
          retention-days: 14
