name: Field and Workbench CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "lmpc/server/**"
      - ".github/workflows/apps-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "lmpc/server/**"
      - ".github/workflows/apps-ci.yml"
  workflow_dispatch:

jobs:
  server-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt
      - name: Verify Field, Workbench and server contracts
        run: >-
          python -m pytest -q
          tests/test_api_scans.py
          tests/test_pipeline.py
          tests/test_mobile_server.py
          tests/test_rbac.py
          tests/test_db_models.py
          tests/test_import_graph.py

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  workbench-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lmpc
          POSTGRES_USER: lmpc
          POSTGRES_PASSWORD: lmpc_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmpc -d lmpc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LMPC_DB_URL: postgresql+psycopg://lmpc:lmpc_local@127.0.0.1:5432/lmpc
      LMPC_OFFICER_UUID: 00000000-0000-4000-8000-000000000002
      LMPC_JURISDICTION_UUID: 00000000-0000-4000-8000-000000000001
      LMPC_AUTH_MODE: local
      LMPC_BOOTSTRAP_EMAIL: e2e-admin@local.invalid
      LMPC_BOOTSTRAP_PASSWORD: E2E-${{ github.run_id }}-Local-Password!
      LMPC_BOOTSTRAP_ROLE: ADMIN
      LMPC_ALLOW_SELF_REVIEW: true
      LMPC_COOKIE_SECURE: false
      LMPC_RULEPACK_PATH: ${{ github.workspace }}/rulepack/current.json
      LMPC_JWT_KEY_PATH: /tmp/lmpc-e2e-${{ github.run_id }}/jwt.pem
      LMPC_STORAGE_ROOT: /tmp/lmpc-e2e-${{ github.run_id }}/objects
      LMPC_RATE_LIMIT_PER_MIN: 300
      LMPC_LOG_LEVEL: WARNING
      LMPC_E2E_EMAIL: e2e-admin@local.invalid
      LMPC_E2E_PASSWORD: E2E-${{ github.run_id }}-Local-Password!
      LMPC_E2E_API_COMMAND: >-
        python -m uvicorn lmpc.server.main:app --app-dir ../..
        --host 127.0.0.1 --port 8010
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt
      - name: Prepare local database
        run: |
          python -m alembic upgrade head
          python -m lmpc.server.db.bootstrap
      - name: Install Workbench and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise critical Workbench flow
        working-directory: apps/web
        run: npm run test:e2e
      - name: Publish Workbench browser and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-e2e-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: error
          retention-days: 30

  field:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run doctor
      - run: npx expo export --platform android --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: lmpc-field-js-bundle
          path: apps/mobile/dist
          retention-days: 14
